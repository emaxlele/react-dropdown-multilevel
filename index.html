  <!-- Script per impostare la lingua dinamica -->
  <script>
    // Rileva la lingua del browser
    const userLang = navigator.language || navigator.userLanguage || "en-EN";

    // Imposta la lingua dinamicamente nel tag <html>
    document.documentElement.lang = userLang;

    // Puoi anche usare navigator.languages per supportare una lista di lingue preferite
    // const userLang = navigator.languages[0] || navigator.language;
  </script>
  <script type="module" src="/src/test/main.tsx"></script>
