name: Publish to npm

on:
  release:
    types: [published]

# OIDC "Trusted Publishing": pubblica su npm senza token.
# Richiede un Trusted Publisher configurato su npmjs.com per questo
# pacchetto (repo emaxlele/react-dropdown-multilevel, workflow publish.yml).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted Publishing (OIDC) richiede npm >= 11.5.1
      - name: Upgrade npm
        run: npm i -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} != package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Pubblica il pacchetto preparato in dist/ (devDeps rimosse da
      # scripts/prepare-dist-package.js). OIDC fornisce auth + provenance.
      - name: Publish (OIDC Trusted Publishing)
        run: npm publish --access public
        working-directory: dist
